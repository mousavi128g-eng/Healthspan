<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Healthspan</title>
  <meta name="description" content="Short health lessons with quizzes that add up over a lifetime.">
  <meta name="theme-color" content="#0f766e">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- iPhone home screen settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Healthspan">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>Healthspan</h1>
    <p class="sub">Health lessons that add up over a lifetime</p>
  </header>

  <main id="app"></main>

  <footer class="foot">
    <button id="reset" class="link" type="button">Reset my progress</button>
  </footer>

  <script src="content.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
